name: Build UROOJ Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-wrapper/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK with bundled app files
        working-directory: android-wrapper
        run: gradle --no-daemon clean assembleDebug

      - name: Validate APK package and signature
        run: |
          APK="android-wrapper/app/build/outputs/apk/debug/UROOJByIdeasofHamza-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UROOJByIdeasofHamza-v1.0.3
          path: android-wrapper/app/build/outputs/apk/debug/UROOJByIdeasofHamza-debug.apk
          if-no-files-found: error
          retention-days: 14
