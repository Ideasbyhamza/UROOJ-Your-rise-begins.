plugins {
    id 'com.android.application'
}

android {
    namespace 'com.urooj.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.urooj.app'
        minSdk 23
        // Target 34 for a conservative first public test build while remaining
        // compatible with current Android devices. Raise after device testing.
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }
}
